<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fondo Obsidian Enterprise -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Gradiente Esmeralda FinTech -->
    <linearGradient id="emeraldPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Gradiente Cian Cloud / Red Global -->
    <linearGradient id="cyanPillar" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Gradiente Violeta Orquestación & IA -->
    <linearGradient id="violetCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Resplandor Exterior Suave -->
    <filter id="hyperGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Contenedor / Canvas de la App Icon (Bordes Redondeados iOS / Android 14) -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3" />

  <!-- AURA DE ENERGÍA DE LOS 8 PILARES -->
  <circle cx="256" cy="256" r="170" fill="url(#emeraldPillar)" opacity="0.08" filter="blur(40px)" />
  <circle cx="256" cy="256" r="130" fill="url(#cyanPillar)" opacity="0.10" filter="blur(30px)" />

  <!-- EL MONOGRAMA "S" ISOMÉTRICO CONTINUO -->
  <g transform="translate(256, 256) scale(1.65) translate(-100, -100)">
    <!-- Base Sombras Profundas -->
    <ellipse cx="100" cy="192" rx="70" ry="12" fill="#000000" opacity="0.6" filter="blur(8px)" />

    <!-- Trazo Inferior Posterior -->
    <path d="M 60,70 C 60,30 140,30 140,70 C 140,110 60,118 60,158 C 60,198 140,198 140,158" 
          fill="none" stroke="#0B132B" stroke-width="28" stroke-linecap="round" />

    <!-- Tira Superior Esmeralda (Finanzas, Legal, ERP) -->
    <path d="M 52,78 C 52,32 118,22 148,54 C 164,70 164,96 138,112 L 98,130 C 68,142 48,160 48,188" 
          fill="none" stroke="url(#emeraldPillar)" stroke-width="22" stroke-linecap="round" />

    <!-- Tira Inferior Cian Eléctrico (Cloud, Hosting, Infraestructura) -->
    <path d="M 148,122 C 148,168 82,178 52,146 C 36,130 36,104 62,88 L 102,70 C 132,58 152,40 152,12" 
          fill="none" stroke="url(#cyanPillar)" stroke-width="22" stroke-linecap="round" />

    <!-- Núcleo Central de Convergencia Tecnológica -->
    <circle cx="100" cy="100" r="16" fill="url(#violetCore)" filter="url(#hyperGlow)" />
    <circle cx="100" cy="100" r="7" fill="#FFFFFF" />

    <!-- Vértices Satélite de los Ejes del Negocio -->
    <circle cx="52" cy="78" r="6" fill="#A7F3D0" />
    <circle cx="148" cy="122" r="6" fill="#BAE6FD" />
    <circle cx="148" cy="54" r="5" fill="#34D399" />
    <circle cx="52" cy="146" r="5" fill="#38BDF8" />
  </g>
</svg>
