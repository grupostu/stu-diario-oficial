name: Deploy Stu Diario Oficial

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      authorization:
        description: 'Escribe exactamente: Autorizo desplegar'
        required: true
        type: string

permissions:
  contents: read

env:
  CONTABO_HOST: 169.58.255.217
  DEPLOY_DIR: /srv/stu/stu-diario-oficial

jobs:
  verify:
    name: Build & Tests Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify & Test
        run: |
          npm install
          npm run build
          npm test

  deploy:
    name: Deploy to Contabo (diariosoficiales.grupostu.com)
    needs: verify
    # Un push solo valida; production exige despacho manual, texto de autorización y revisión del environment si está protegida externamente.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.authorization == 'Autorizo desplegar'
    environment: production
    # Un deploy a la vez, sin cancelar el que está en curso; no bloquea las verificaciones.
    concurrency:
      group: deploy-stu-diario-oficial
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Derivados de secretos: solo en el job que los usa, no en las verificaciones.
    env:
      SSH_USER: ${{ secrets.CONTABO_SSH_USER || 'root' }}
      SSH_PORT: ${{ secrets.CONTABO_SSH_PORT || 22 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Configure SSH
        env:
          CONTABO_SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CONTABO_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Usuario y puerto van a ssh-keyscan y a ~/.ssh/config: se validan antes de usarlos (evita inyectar directivas).
          case "$SSH_USER" in ''|*[!A-Za-z0-9._-]*) echo "CONTABO_SSH_USER vacío o con caracteres no válidos"; exit 1;; esac
          case "$SSH_PORT" in ''|*[!0-9]*) echo "CONTABO_SSH_PORT debe ser numérico"; exit 1;; esac
          ssh-keyscan -p "$SSH_PORT" -T 15 -H "$CONTABO_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          # Heredoc sin comillas: solo expande $CONTABO_HOST, $SSH_USER y $SSH_PORT (vienen de env, no del script).
          cat << SSHEOF > ~/.ssh/config
          Host contabo-vps $CONTABO_HOST
            HostName $CONTABO_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            ConnectTimeout 25
            ConnectionAttempts 5
            ServerAliveInterval 15
            ServerAliveCountMax 4
            StrictHostKeyChecking accept-new
            BatchMode yes
          SSHEOF
          chmod 600 ~/.ssh/config

      - name: Sync sources to VPS
        run: |
          retry() {
            local max=5; local delay=3; local count=1
            while true; do
              "$@" && break || {
                if [ $count -lt $max ]; then
                  echo "[CI-Resilience] Intento $count fallido. Reintentando en ${delay}s..."
                  sleep $delay
                  count=$((count + 1))
                else
                  echo "[CI-Resilience] Comando falló tras $max intentos: $*"
                  return 1
                fi
              }
            done
          }

          retry ssh contabo-vps "mkdir -p $DEPLOY_DIR"
          retry rsync -az --delete -e "ssh" \
            --exclude='.git' --exclude='node_modules' --exclude='dist' --exclude='.env' --exclude='.env.*' \
            ./ contabo-vps:$DEPLOY_DIR/

      - name: Build and Start Containers
        run: |
          ssh contabo-vps bash -se <<REMOTE
          set -euo pipefail
          cd $DEPLOY_DIR
          docker compose -f docker-compose.prod.yml up -d --build
          docker image prune -f >/dev/null
          REMOTE

      - name: Verify Containers Health
        run: |
          ssh contabo-vps \
            'for i in $(seq 1 30); do [ "$(docker inspect -f "{{.State.Health.Status}}" stu-diario-oficial)" = healthy ] && echo diario healthy && break; sleep 4; done; docker ps --filter name=stu-diario-oficial'
